name: Build All(主工作流)

on:
  workflow_dispatch:
    inputs:
       SUFFIXX:
        type: string
        description: "自定义内核后缀 (留空则使用随机字符串)"
        required: false
        default: "QQQiuCi-SukiSU-Test-Build"
        ace_pro:
        description: "ace_pro"
        type: boolean
        default: false


jobs:
  ace_pro:
    if: ${{ github.event.inputs.ace5pro_no_kpm == 'true' }}
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIX }}


