name: Build All

on:
  workflow_dispatch:
    inputs:
      SUFFIXX:
        type: string
        description: "自定义内核后缀 (留空则使用随机字符串)"
        required: false
        default: "QQQiuCi-SukiSU-Test-Build"
      ace_pro:
        description: "ace_pro工作流测试"
        type: boolean
        default: false
      oneplus_11:
        description: "oneplus_11工作流测试"
        type: boolean
        default: false
      oneplus12:
        description: "oneplus12工作流测试"
        type: boolean
        default: false
      oneplus_ace2:
        description: "oneplus_ace2工作流测试"
        type: boolean
        default: false
      oneplus_ace2_pro:
        description: "oneplus_ace2_pro工作流测试"
        type: boolean
        default: false
      oneplus_ace3:
        description: "oneplus_ace3工作流测试"
        type: boolean
        default: false
      oneplus_ace3_pro:
        description: "oneplus_ace3_pro工作流测试"
        type: boolean
        default: false
      ace3v:
        description: "oneplus_ace3v工作流测试"
        type: boolean
        default: false
      oneplus_ace5:
        description: "oneplus_ace5工作流测试"
        type: boolean
        default: false

jobs:
  ace_pro:
    if: ${{ github.event.inputs.ace_pro == 'true' }}
    uses: ./.github/workflows/SukiSU-OnePlus.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIXX }}
      FEIL: "oneplus_ace_pro_v"

  oneplus_11:
    if: ${{ github.event.inputs.oneplus_11 == 'true' }}
    uses: ./.github/workflows/SukiSU-OnePlus.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIXX }}
      FEIL: "oneplus_11_v"

  oneplus12:
    if: ${{ github.event.inputs.oneplus12 == 'true' }}
    uses: ./.github/workflows/SukiSU-OnePlus.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIXX }}
      FEIL: "oneplus12_v"

  oneplus_ace2:
    if: ${{ github.event.inputs.oneplus_ace2 == 'true' }}
    uses: ./.github/workflows/SukiSU-OnePlus.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIXX }}
      FEIL: "oneplus_ace2_v"

  oneplus_ace2_pro:
    if: ${{ github.event.inputs.oneplus_ace2_pro == 'true' }}
    uses: ./.github/workflows/SukiSU-OnePlus.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIXX }}
      FEIL: "oneplus_ace2_pro_v"

  oneplus_ace3:
    if: ${{ github.event.inputs.oneplus_ace3 == 'true' }}
    uses: ./.github/workflows/SukiSU-OnePlus.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIXX }}
      FEIL: "oneplus_ace3_v"

  oneplus_ace3_pro:
    if: ${{ github.event.inputs.oneplus_ace3_pro == 'true' }}
    uses: ./.github/workflows/SukiSU-OnePlus.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIXX }}
      FEIL: "oneplus_ace3_pro_v"

  ace3v:
    if: ${{ github.event.inputs.ace3v == 'true' }}
    uses: ./.github/workflows/SukiSU-OnePlus.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIXX }}
      FEIL: "oneplus_ace_3v_v"

  oneplus_ace5:
    if: ${{ github.event.inputs.oneplus_ace5 == 'true' }}
    uses: ./.github/workflows/SukiSU-OnePlus.yml
    secrets: inherit
    with:
      SUFFIX: ${{ github.event.inputs.SUFFIXX }}
      FEIL: "oneplus_ace5"
